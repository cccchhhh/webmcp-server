services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DEPLOYMENT_MODE: remote
      HOST: 0.0.0.0
      PORT: 38472
      PUBLIC_BASE_URL: https://${MCP_DOMAIN:?Set MCP_DOMAIN}
      ALLOWED_HOSTS: ${MCP_DOMAIN:?Set MCP_DOMAIN},localhost,127.0.0.1
      BRIDGE_CONFIG_FILE: /data/private/credentials.json
    volumes:
      - bridge-data:/data
    expose: ["38472"]
    stop_grace_period: 10s
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  proxy:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:?Set MCP_DOMAIN}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    ports: ["443:443"]
    depends_on: [app]
    restart: unless-stopped
volumes:
  bridge-data:
